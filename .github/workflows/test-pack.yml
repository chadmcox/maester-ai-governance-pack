name: Test pack

# Validates this pack's structure and test metadata on every PR (Test-MtPack), then runs this
# repo's Pester unit tests (Invoke-Pester).
#
# The installable pack lives in pack/ (maester-pack.json, tests/, helpers/), not the repo root.
# Test-MtPack and Install-MtPack both run a repo-wide content-safety scan that rejects any .ps1
# file whose top level is not exclusively function definitions. A Pester *.Tests.ps1 file's
# top-level Describe/BeforeAll blocks fail that scan, so Pester test files cannot live anywhere
# inside pack/. Keeping them in unit-tests/ at the repo root means Test-MtPack -Path pack/ never
# sees them (installs via `Install-MtPack chadmcox/maester-ai-governance-pack/pack` don't either),
# while Invoke-Pester ./unit-tests still runs them here.
#
# PROVISIONAL: Test-MtPack, New-MtPack and the rest of the Maester Packs tooling are not in a
# published Maester release yet (Maester 3.0 is unreleased). Until Maester 3.0 ships to the
# PowerShell Gallery, this workflow builds Maester from a pinned commit on main
# (616559854634e5150dbde69850c4224191635bb1) instead of `Install-Module Maester`, so CI doesn't
# silently pick up unrelated upstream changes. Switch this step to
# `Install-Module Maester -RequiredVersion <pinned 3.x>` once that version is published, and
# remove the pinned-commit checkout. Bump the pin deliberately if a newer Maester commit is needed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: "Checkout Maester (provisional: Packs tooling is unreleased, pinned for reproducibility)"
        uses: actions/checkout@v4
        with:
          repository: maester365/maester
          ref: 616559854634e5150dbde69850c4224191635bb1
          path: maester-src

      - name: Validate the pack with Test-MtPack
        shell: pwsh
        run: |
          Import-Module "$env:GITHUB_WORKSPACE/maester-src/powershell/Maester.psd1" -Force
          $result = Test-MtPack -Path "$env:GITHUB_WORKSPACE/repo/pack"
          $result | Format-List
          if (-not $result.IsValid) {
            Write-Error "Pack validation failed: $($result.Errors | ConvertTo-Json -Depth 5)"
            exit 1
          }

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          # The [MaesterTest(...)] attribute used on every pack test function requires the Maester
          # module type to be loaded before Pester dot-sources any pack/tests/*.ps1 file.
          Import-Module "$env:GITHUB_WORKSPACE/maester-src/powershell/Maester.psd1" -Force
          $config = New-PesterConfiguration
          $config.Run.Path = "$env:GITHUB_WORKSPACE/repo/unit-tests"
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) Pester test(s) failed."
            exit 1
          }
